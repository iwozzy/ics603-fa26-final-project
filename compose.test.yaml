name: lumiere-test
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lumiere_test
      POSTGRES_DB: lumiere_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lumiere_test -d lumiere_test"]
      interval: 1s
      timeout: 3s
      retries: 40
