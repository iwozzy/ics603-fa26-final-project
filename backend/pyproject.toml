[project]
name = "lumiere"
version = "0.1.0"
description = "A web app that helps people discover movies from their favorite actors, directors and creative team."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "logfire>=5.5.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.16",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumiere"]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff.lint]
extend-select = ["C90", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]

[tool.importlinter]
root_package = "lumiere"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is independent of adapters and frameworks"
type = "forbidden"
source_modules = ["lumiere.domain", "lumiere.application"]
forbidden_modules = [
    "lumiere.adapters", "lumiere.bootstrap", "lumiere.config",
    "fastapi", "starlette", "pydantic", "pydantic_settings", "httpx", "logfire",
    "sqlalchemy", "tmdb", "pydantic_ai",
]

[[tool.importlinter.contracts]]
name = "Domain does not depend on application"
type = "forbidden"
source_modules = ["lumiere.domain"]
forbidden_modules = ["lumiere.application"]
