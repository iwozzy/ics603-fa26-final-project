[project]
name = "ics603-fa26-final-project"
version = "0.1.0"
description = "A web app that helps people discover movies from their favorite actors, directors and creative team."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff.lint]
extend-select = ["C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
